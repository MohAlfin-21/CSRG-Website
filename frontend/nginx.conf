server {
  listen 8080;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # ── Gzip Compression ────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

  # ── Hide nginx version from Server header ────────────────────────────────
  server_tokens off;

  # ── Maximum Upload Size (Supports up to 15MB file/CV uploads) ─────────────
  client_max_body_size 15M;

  # ── Security Headers ─────────────────────────────────────────────────────
  # Force HTTPS via HSTS
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Prevent MIME-type sniffing
  add_header X-Content-Type-Options "nosniff" always;

  # Prevent page from being embedded in iframes (Clickjacking protection)
  add_header X-Frame-Options "DENY" always;

  # Enable browser XSS filter (legacy, still useful for older browsers)
  add_header X-XSS-Protection "1; mode=block" always;

  # Control referrer information
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Restrict browser feature access
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Content-Security-Policy
  # frame-src: allow 'self' + any HTTPS origin to support live preview iframe
  # for products with arbitrary live_preview_url (e.g. mataelang.net, github.io, etc.)
  # We keep https: (any HTTPS) rather than * to block plain HTTP embeds.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https: ws:; font-src 'self' data: https: https://fonts.gstatic.com; frame-src 'self' https:; object-src 'none'; base-uri 'self';" always;

  # ── Reverse Proxy for Backend API & Object Storage ──────────────────────
  # Keeps internal ports (FastAPI 8000, MinIO 9000) protected inside Docker network
  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    proxy_connect_timeout 90s;
  }

  location /csrg-media/photos/ {
    proxy_pass http://minio:9000/csrg-media/photos/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }

  # ── SPA Routing (HTML must NEVER be cached by browser) ──────────────────
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https: ws:; font-src 'self' data: https: https://fonts.gstatic.com; frame-src 'self' https:; object-src 'none'; base-uri 'self';" always;
  }

  # ── Static Asset Caching (Content-hashed JS, CSS, images) ───────────────
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # ── Block access to hidden files (.env, .git, etc.) ──────────────────────
  location ~ /\. {
    deny all;
    return 404;
  }
}

