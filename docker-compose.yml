services:
  mongo:
    image: mongo:4.4
    restart: always
    command: mongod --auth
    # Port 27017 NOT exposed to host — accessible only within Docker internal network.
    # Backend connects via service name: mongodb://user:pass@mongo:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-csrg_database}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "-u", "${MONGO_ROOT_USERNAME}", "-p", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  minio:
    image: quay.io/minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"   # S3 API — bind to loopback for local dev/admin access
      # Port 9001 (MinIO Console) NOT exposed to host — only for internal management.
      # Access console via: docker exec -it <minio-container> /bin/sh
      # Or use an SSH tunnel: ssh -L 9001:localhost:9001 user@server
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    # No source volume mount in production.
    # Use 'docker compose -f docker-compose.yml -f docker-compose.dev.yml up' for dev.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if getattr(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3), 'status', 0) == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build: ./frontend
    env_file:
      - ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"
    # No source volume mount in production.
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  mongo_data:
  minio_data:
